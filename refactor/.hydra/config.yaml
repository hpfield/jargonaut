paths:
  data_file: ../govuk-policy-qa-pairs/policy_papers_small.json
  output_dir: outputs
  prompt_file: prompts/custom_qa_generate_prompt.txt
  train_dataset_path: outputs/generate_qa/24-12-22_19-45-34/train_dataset.json
  val_dataset_path: outputs/generate_qa/24-12-22_19-45-34/val_dataset.json
  finetuned_model_path: outputs/finetune/24-12-22_19-47-38/finetuned_model
  doc_embeddings_path: outputs/build_embeddings/24-12-22_19-48-19/doc_embeddings.pkl
llm:
  ckpt_dir: ${oc.env:HOME}/.llama/checkpoints/Meta-Llama3.1-8B-Instruct
  tokenizer_path: ../llama-models/models/llama3/api/tokenizer.model
  max_seq_len: 4096
  max_batch_size: 4
  model_parallel_size: null
  temperature: 0.6
  top_p: 0.9
training:
  test_size: 0.2
  random_state: 42
  save_every: 500
  num_questions_per_chunk: 2
  retry_limit: 3
  on_failure: continue
  train_subset_size: 5
  val_subset_size: 5
server:
  host: 127.0.0.1
  port: 5000
  debug: false
