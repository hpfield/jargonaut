paths:
  data_file: ../govuk-policy-qa-pairs/policy_papers_small.json
  output_dir: outputs
  prompt_file: prompts/custom_qa_generate_prompt.txt
  train_dataset_path: outputs/24-12-22_18-18-56/train_dataset.json
  val_dataset_path: outputs/24-12-22_18-18-56/val_dataset.json
llm:
  ckpt_dir: ${oc.env:HOME}/.llama/checkpoints/Meta-Llama3.1-8B-Instruct
  tokenizer_path: ../llama-models/models/llama3/api/tokenizer.model
  max_seq_len: 4096
  max_batch_size: 4
  model_parallel_size: null
  temperature: 0.6
  top_p: 0.9
training:
  test_size: 0.2
  random_state: 42
  save_every: 500
  num_questions_per_chunk: 2
  retry_limit: 3
  on_failure: continue
  train_subset_size: 5
  val_subset_size: 5
