llm:
  ckpt_dir: ${oc.env:HOME}/.llama/checkpoints/Meta-Llama3.1-8B-Instruct
  max_batch_size: 4
  max_seq_len: 4096
  model_parallel_size: null
  temperature: 0.6
  tokenizer_path: ../llama-models/models/llama3/api/tokenizer.model
  top_p: 0.9
paths:
  data_file: ../govuk-policy-qa-pairs/policy_papers_small.json
  doc_embeddings_path: outputs/build_embeddings/24-12-22_20-16-08/doc_embeddings.pkl
  finetuned_model_path: outputs/finetune/24-12-22_20-16-00/finetuned_model
  output_dir: outputs
  prompt_file: prompts/custom_qa_generate_prompt.txt
  system_prompt_file: prompts/custom_qa_generate_system.txt
  train_dataset_path: outputs/generate_qa/24-12-22_20-15-41/train_dataset.json
  val_dataset_path: outputs/generate_qa/24-12-22_20-15-41/val_dataset.json
server:
  debug: false
  host: 127.0.0.1
  port: 5000
training:
  num_questions_per_chunk: 2
  on_failure: continue
  random_state: 42
  retry_limit: 3
  save_every: 500
  test_size: 0.2
  train_subset_size: 5
  val_subset_size: 5
